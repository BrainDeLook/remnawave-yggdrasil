name: Build optional offline converter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-converter:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pyinstaller==6.16.0
          python desktop.py --self-test
          python -m PyInstaller --onefile --windowed --name RemnawaveConverter desktop.py
          $p = Start-Process -FilePath dist/RemnawaveConverter.exe -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged converter self-test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: RemnawaveConverter-Windows-x64
          path: dist/RemnawaveConverter.exe
